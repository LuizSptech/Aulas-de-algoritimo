<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input placeholder="nome do cliente" id="ipt_nome">
    <br>
    <button onclick="enter()">Entrar na Fila</button>
    <br>
    <button onclick="out()">Chamar Proximo</button>
    <hr>
    <div id="entrada"></div>
    <hr>
    <div id="saida"></div>

</body>
</html>

<script>


let lista = []
let proximo = ipt_nome.value

function enter(){
    if(proximo == ''){
        alert('preencha um nome')
    }else {
    lista.push(proximo)
    entrada.innerHTML = `${proximo} entrou na fila na posição ${lista.length}`
}
}


function out(){
    if(lista.length == 0){
        alert('Não há clientes na fila')
    }else {
        let atual = lista.shift()
        saida.innerHTML = `Chamando: ${atual}. Restam ${lista.length} pessoa(s) na fila`
    }

}
</script>
