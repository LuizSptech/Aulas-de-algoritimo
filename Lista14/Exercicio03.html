<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input placeholder="Digite uma URL" id="ipt_URL">
    <br>
    <button onclick="go()">Visitar</button>
    <br>
    <button onclick="back()">Voltar</button>
    <br>
    <div id="paginas"></div>
    <br>
    <div id="_historico"></div>


</body>
</html>

<script>
    let historico = []
    
    
    function go(){
    let entrada = ipt_URL.value;
    if(entrada == ''){
        alert('Digite uma URL antes de visitar')
    }else {
        historico.push(entrada)
        paginas.innerHTML = `visitando: ${entrada} historico: ${historico}`
    }
}

function back(){
    _historico.innerHTML = ''
    if(historico == ''){
        alert('Não há paginas no historico')
    }else if (historico.length == 1){
        _historico.innerHTML += `Você esta na pagina inicial. Não e possivel voltar mais`
    }else {
        let atualizacao = historico.pop()
        _historico.innerHTML += `Voltando para: ${atualizacao} historico ${historico}`
    }

}
   
</script>
