<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="make()">Mostrar Média</button>
    <div id="div_mensagem"></div>
</body>

</html>

<script>
    function make() {
        let contador = 0
        let notas = []
        let turma = [{
            "nome": "Luiz",
            "nota": 7,
        },
        {
            "nome": "Alan",
            "nota": 1,
        },
        {
            "nome": "Rafaela",
            "nota": 8,
        }, {
            "nome": "Murilo",
            "nota": 9,
        },

        {
            "nome": "Lucas",
            "nota": 10,
        }]
        for(let i = 0; i < turma.length; i++){
            notas.push(turma[i].nota)
            contador += notas[i]
            div_mensagem.innerHTML = ` a media da sala sera ${contador / turma.length}`
            }
            
            
            
        }
    
</script>
