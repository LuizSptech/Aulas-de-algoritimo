<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #bolinha {
        width: 100px;
        height: 100px;
        background: black;
        border-radius: 100%;
        position: absolute;
                

    }

    #borda {
        
        width: 500px;
        height: 500px;
        border-color: black;
        border-style: solid;
        
        
    }
</style>

<body>
    <div id="borda">
        <div id="bolinha"></div>
    </div>
    <button onclick="make()">ping-poing</button>
    <div id="saida"></div>

</body>

</html>

<script>
    const borda = document.getElementById('borda')
    const bolinha = document.getElementById('bolinha')
    const bordaArea = borda.offsetHeight
    const bordaBolinha = bolinha.offsetHeight
    const limite = bordaArea - bordaBolinha

    let animacao 
    console.log(bordaBolinha)
    console.log(limite)
function make() {
        let posicao = 0
        let direcao = 1
        let velocidade = 20
        let batidas = 0
        
            animacao = setInterval(() => {
            posicao += velocidade * direcao
            bolinha.style.top = `${posicao}px`
            if (posicao >= limite) {
                batidas += 1
                saida.innerHTML = `${batidas}`
                direcao = -1
            } else if (posicao <= 0) {
                batidas += 1
                saida.innerHTML = `${batidas}`
                direcao = 1
            }
        }, 100)
       
    }
</script>
