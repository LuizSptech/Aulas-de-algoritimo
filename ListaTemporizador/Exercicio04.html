<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #bolinha{
        width: 100px;
        height: 100px;
        background: black;
        border-radius: 100%;
        position: absolute;
    }
    #borda{
        width: 500px;
        height: 500px;
        border-color:black ;
        border-style: solid;
    }
</style>
<body>
    <div id="borda">
        <div id="bolinha"></div>
    </div>
    <button onclick="make()">ping-poing</button>
    
</body>
</html>

<script>
    const borda = document.getElementById('borda')
    const bolinha = document.getElementById('bolinha')
    const bordaArea = borda.offsetWidth
    const bordaBolinha = bolinha.offsetWidth
    const limite = bordaArea - bordaBolinha
    
    console.log(bordaBolinha)
    console.log(limite)
    
function make(){
    let posicao = 0
    let direcao = 1
    let velocidade = 5
    setInterval(() =>{
        posicao += velocidade * direcao
        bolinha.style.left = `${posicao}px`
        direcao = -1
        if(posicao >= limite ){
        }else if(posicao <= 0 ){
            direcao = 1
        }
        console.log(posicao)
    },100
)

}
</script>
